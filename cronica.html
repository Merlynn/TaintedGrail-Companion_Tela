<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kings of Ruin - Crônica</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@600;700&family=Crimson+Pro:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root { 
            --font-celtic: 'Celtic Garamond', 'Crimson Pro', serif; 
            --font-title: 'Cinzel', serif;
            --font-ui: 'Alegreya Sans', sans-serif;
        }

        .material-symbols-rounded { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; display: inline-block; vertical-align: middle; line-height: 1; }
        .icon-thin { font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24; }
        .icon-outlined { font-variation-settings: 'FILL' 0, 'wght' 600, 'GRAD' 0, 'opsz' 24; }

        body {
            background-color: transparent; color: #b8b4a7; -webkit-tap-highlight-color: transparent;
            font-family: var(--font-celtic); overflow-x: hidden; position: relative; margin: 0; padding: 0; font-size: 16px;
        }

        body::after {
            content: ""; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: linear-gradient(rgba(7, 9, 8, 0.8), rgba(7, 9, 8, 0.85)), url('https://lh3.googleusercontent.com/d/1CVTwNLqVBc4Y97ZD82hIaf4wJnPeK4-L');
            background-size: cover; background-position: center; pointer-events: none; z-index: -2;
        }

        ::-webkit-scrollbar { display: none; }

        h1, h2, h3, .font-title { font-family: var(--font-title) !important; }
        .font-sans { font-family: var(--font-ui) !important; }
        .font-celtic { font-family: var(--font-celtic) !important; }

        /* CABEÇALHO */
        .site-header {
            background: linear-gradient(180deg, rgba(7, 9, 8, 0.95) 0%, rgba(7, 9, 8, 0.85) 100%);
            border-bottom: 1px solid rgba(43, 54, 48, 0.5); padding: 8px 16px; display: flex;
            justify-content: space-between; align-items: center; position: relative; z-index: 50;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .header-logo-img { height: clamp(44px, 11vw, 54px); width: auto; max-width: 260px; object-fit: contain; display: block; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.7)); }

        /* BOTÃO ECOS */
        .music-player-slot {
            display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 6px;
            background: #060807; border: 1px solid #2b3630; border-radius: 9999px;
            color: #c2a675; font-family: var(--font-ui); font-size: clamp(0.7rem, 2.5vw, 0.8rem);
            font-weight: bold; letter-spacing: 0.1em; text-transform: uppercase;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.9), 0 2px 6px rgba(0,0,0,0.6); cursor: pointer; transition: all 0.2s ease;
        }
        .music-player-slot:hover { border-color: #c2a675; background: #0a0d0b; }
        .music-player-icon {
            background: #1a211e; color: #c2a675; width: 26px; height: 26px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; border: 1px solid #2b3630;
        }

        /* PLAYER FLUTUANTE (POPOVER) */
        .player-popover {
            background: linear-gradient(180deg, #111613 0%, #050706 100%); border: 1px solid #2b3630;
            border-top: 1px solid #3a453f; border-radius: 4px; width: 320px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9), 0 0 15px rgba(194, 166, 117, 0.05);
            position: absolute; top: 70px; right: 16px; z-index: 60; overflow: hidden;
            transform-origin: top right; transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .player-artwork-glow {
            width: 72px; height: 72px; border-radius: 50%; background: radial-gradient(circle, rgba(194, 166, 117, 0.15) 0%, transparent 70%);
            display: flex; align-items: center; justify-content: center; border: 1px solid rgba(194, 166, 117, 0.2); box-shadow: 0 0 15px rgba(0,0,0,0.5); flex-shrink: 0;
        }
        .player-ctrl-btn { color: #8c938f; background: transparent; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; padding: 0; }
        .player-ctrl-btn:hover { color: #c2a675; transform: scale(1.05); }
        .player-ctrl-btn:active { transform: scale(0.95); }
        .player-play-btn {
            width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #d4b886 0%, #9c7f4c 100%);
            color: #060807; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6), inset 1px 1px 2px rgba(255,255,255,0.4); border: 2px solid #111613; cursor: pointer; transition: all 0.2s;
        }
        .player-play-btn:hover { filter: brightness(1.1); box-shadow: 0 4px 15px rgba(194,166,117,0.4); }
        .player-play-btn:active { transform: scale(0.95); }
        .player-muffle-btn {
            padding: 4px 12px; border: 1px solid #2b3630; border-radius: 999px; font-family: var(--font-ui); font-size: 10px;
            font-weight: bold; text-transform: uppercase; letter-spacing: 0.1em; color: #8c938f; background: #090b0a; cursor: pointer; transition: all 0.2s;
        }
        .player-muffle-btn.active { background: #1a211e; color: #c2a675; border-color: #c2a675; box-shadow: 0 0 8px rgba(194,166,117,0.2); }
        .player-overlay { position: fixed; inset: 0; z-index: 45; display: none; }
        .config-select {
            background: #050706; border: 1px solid #2b3630; color: #b8b4a7; outline: none; font-family: var(--font-celtic);
            border-radius: 3px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.9); padding: 0 10px; appearance: none;
        }
        .custom-slider { -webkit-appearance: none; appearance: none; width: 100%; background: transparent; outline: none; margin: 0; padding: 10px 0; }
        .custom-slider::-webkit-slider-runnable-track { width: 100%; height: 8px; background: #050706; border: 1px solid #7a6345; border-radius: 4px; box-shadow: inset 0 1px 4px rgba(0,0,0,1); }
        .custom-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; background: linear-gradient(135deg, #d4b886 0%, #9c7f4c 100%); border: 2px solid #111613; border-radius: 3px; cursor: pointer; transform: rotate(45deg); box-shadow: 3px 3px 6px rgba(0,0,0,0.8), inset 1px 1px 2px rgba(255,255,255,0.4); margin-top: -7px; transition: transform 0.1s; }

        /* O RELÓGIO E DEMAIS ESTILOS */
        .dial-container-large {
            position: relative; width: clamp(200px, 70vw, 300px); height: clamp(200px, 70vw, 300px); border-radius: 50%;
            background-image: url('https://lh3.googleusercontent.com/d/1CsYPx6EHQ0guM14NKt8KxKmhIQccaAs9'); background-size: cover; background-position: center;
            border: 2px solid #1a211e; box-shadow: 0 8px 25px rgba(0,0,0,0.9), inset 0 0 40px rgba(0,0,0,0.95); overflow: hidden; margin: 0 auto;
        }
        .dial-container-large::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, transparent 25%, rgba(0,0,0,0.85) 100%); pointer-events: none; z-index: 5; }
        .hotspot-large { position: absolute; width: clamp(40px, 14vw, 64px); height: clamp(40px, 14vw, 64px); border-radius: 50%; transform: translate(-50%, -50%); z-index: 20; cursor: pointer; transition: all 0.3s ease; }
        .hotspot-large.filled { background: radial-gradient(circle, rgba(220, 20, 20, 0.95) 10%, rgba(150, 0, 0, 0.6) 40%, transparent 70%); mix-blend-mode: color-dodge; border: none; box-shadow: none; }
        .pos-1 { top: 14%; left: 50%; } .pos-2 { top: 20%; left: 80%; } .pos-3 { top: 62%; left: 85%; } .pos-4 { top: 77%; left: 55%; } .pos-5 { top: 63%; left: 20%; } .pos-6 { top: 20%; left: 23%; }

        .modal-input { background: rgba(0,0,0,0.5); border: 1px solid #2b3630; color: #c2a675; font-family: var(--font-celtic); font-size: 1.5rem; padding: 8px 12px; border-radius: 3px; outline: none; width: 100%; text-align: center; text-transform: uppercase; }
        .modal-input:focus { border-color: #c2a675; }

        .bottom-nav-container { display: flex; justify-content: center; align-items: center; height: 4rem; width: 100%; max-width: 512px; margin: 0 auto; gap: clamp(2px, 1.5vw, 12px); padding: 0 4px; }
        .bottom-nav-item { width: clamp(54px, 18vw, 76px); flex-shrink: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 0 2px; transition: color 0.2s; }
        .bottom-nav-label { font-size: clamp(10px, 2.7vw, 12px); font-family: var(--font-ui); text-transform: uppercase; font-weight: 700; letter-spacing: 0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; text-align: center; margin-top: 2px; line-height: 1; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- CABEÇALHO -->
    <header class="site-header flex-shrink-0">
        <img src="https://lh3.googleusercontent.com/d/1U3juHgIiAcpfSSQiW3nWN20MhMUx7tJR" alt="Kings of Ruin" class="header-logo-img">
        <div class="flex items-center gap-3">
            <div class="music-player-slot" title="Controle de Áudio" onclick="togglePlayerMenu()">
                <div class="music-player-icon"><span class="material-symbols-rounded text-[14px] animate-pulse">music_note_2</span></div>
                <span>Ecos</span>
            </div>
            <a href="config.html" class="text-[#6d7872] hover:text-[#c2a675] transition-colors p-1 flex items-center justify-center" title="Configurações">
                <span class="material-symbols-rounded text-[26px]">settings</span>
            </a>
        </div>
    </header>

    <!-- OVERLAY E PLAYER ECOS (POPOVER) -->
    <div id="player-overlay" class="player-overlay" onclick="togglePlayerMenu()"></div>
    <div id="player-panel" class="player-popover opacity-0 scale-95 pointer-events-none">
        <div class="p-5 flex flex-col items-center">
            <div class="flex items-center w-full gap-4 mb-5">
                <div class="player-artwork-glow">
                    <span class="material-symbols-rounded text-[32px] text-[#c2a675] opacity-80">speaker</span>
                </div>
                <div class="flex-1 min-w-0 flex flex-col gap-1.5">
                    <label class="text-[9px] font-sans uppercase font-bold text-[#6d7872]">Playlist Ativa</label>
                    <div class="relative w-full">
                        <select class="config-select !h-[30px] !text-[14px] !pr-8 !bg-[#060807] !border-[#2b3630]">
                            <option>Ecos de Ruína</option>
                            <option>Sangue e Gelo</option>
                        </select>
                        <span class="material-symbols-rounded icon-outlined absolute right-2.5 top-1/2 -translate-y-1/2 text-[#4a5550] pointer-events-none text-[18px]">arrow_drop_down</span>
                    </div>
                    <span class="font-sans text-[12px] text-[#e0d5c1] font-bold truncate mt-1">♪ Faixa 1: Vento Gélido</span>
                </div>
            </div>
            <div class="w-full mb-5 px-1">
                <div class="w-full h-1 bg-[#1a211e] rounded-full overflow-hidden">
                    <div class="w-1/3 h-full bg-[#c2a675] rounded-full"></div>
                </div>
                <div class="flex justify-between mt-1.5">
                    <span class="font-sans text-[10px] text-[#6d7872] font-bold">1:24</span>
                    <span class="font-sans text-[10px] text-[#6d7872] font-bold">-2:15</span>
                </div>
            </div>
            <div class="flex items-center justify-center gap-8 mb-6">
                <button class="player-ctrl-btn"><span class="material-symbols-rounded text-[32px]">skip_previous</span></button>
                <button class="player-play-btn" id="main-play-btn" onclick="togglePlayState()">
                    <span id="play-icon" class="material-symbols-rounded text-[28px]">play_arrow</span>
                </button>
                <button class="player-ctrl-btn"><span class="material-symbols-rounded text-[32px]">skip_next</span></button>
            </div>
            <div class="w-full pt-4 border-t border-[#141a17] space-y-4">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-rounded text-[#6d7872] text-[20px]">volume_down</span>
                    <input type="range" id="vol-slider" min="0" max="100" value="80" class="custom-slider flex-1" oninput="updateVolume(this.value)">
                    <span class="material-symbols-rounded text-[#c2a675] text-[20px]">volume_up</span>
                </div>
                <div class="flex justify-center">
                    <button id="muffle-btn" class="player-muffle-btn flex items-center justify-center gap-1" onclick="toggleMuffle()">
                        <span class="material-symbols-rounded icon-outlined text-[14px]">mic</span> Atenuar P/ Narrar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL (CRÔNICA) -->
    <main class="flex-1 overflow-y-auto w-full max-w-lg mx-auto z-10 flex flex-col pt-5 pb-24 px-4 items-center justify-start">
        
        <!-- CAPÍTULO -->
        <div class="flex flex-col items-center w-full mb-1">
            <div class="flex items-center justify-center gap-2 sm:gap-4 w-full">
                <button onclick="adjustChapter(-1)" class="text-[#8c938f] hover:text-[#c2a675] px-1 transition-transform active:scale-90 flex-shrink-0">
                    <span class="font-title text-[42px] sm:text-[48px] leading-none pb-1">&laquo;</span>
                </button>
                <div onclick="openTextModal('chapter')" class="flex items-baseline justify-center cursor-pointer group whitespace-nowrap overflow-hidden">
                    <div class="font-title text-[#c2a675] uppercase font-bold drop-shadow-md transition-colors group-hover:text-white leading-none tracking-widest">
                        <span class="text-[clamp(34px,9vw,44px)]">C</span><span class="text-[clamp(24px,7vw,32px)]">APÍTULO</span>
                        <span id="chapter-val" class="text-[clamp(34px,9vw,44px)] ml-2">1</span>
                    </div>
                </div>
                <button onclick="adjustChapter(1)" class="text-[#8c938f] hover:text-[#c2a675] px-1 transition-transform active:scale-90 flex-shrink-0">
                    <span class="font-title text-[42px] sm:text-[48px] leading-none pb-1">&raquo;</span>
                </button>
            </div>
        </div>

        <!-- PARTE -->
        <div class="w-full flex items-center justify-center mt-1 mb-5">
            <button onclick="adjustPart(-1)" class="text-[#4a5550] hover:text-[#c2a675] px-2 transition-transform active:scale-90 flex items-center justify-center mr-2">
                <span class="font-title text-[34px] sm:text-[38px] leading-none pb-1">&lsaquo;</span>
            </button>
            <div class="flex items-center cursor-pointer group" onclick="openTextModal('part')">
                <h2 class="font-title text-[15px] sm:text-[17px] text-[#c2a675] uppercase tracking-[0.15em] font-bold m-0 leading-none group-hover:text-white transition-colors">
                    Parte <span id="part-val">A:1</span>
                </h2>
            </div>
            <button onclick="adjustPart(1)" class="text-[#4a5550] hover:text-[#c2a675] px-2 transition-transform active:scale-90 flex items-center justify-center ml-2">
                <span class="font-title text-[34px] sm:text-[38px] leading-none pb-1">&rsaquo;</span>
            </button>
        </div>

        <div class="h-[2px] w-[70%] bg-gradient-to-r from-transparent via-[#c2a675] to-transparent mb-6 opacity-50"></div>

        <!-- RELÓGIO -->
        <div class="flex flex-col items-center w-full relative z-10">
            <div class="w-full flex items-center justify-center gap-2 mb-6">
                <span class="text-[#8c938f] text-[11px] select-none">♦</span>
                <h3 class="font-title text-[15px] sm:text-[17px] text-[#c2a675] uppercase tracking-[0.15em] font-bold m-0 leading-none text-center">
                    Passagem do Tempo
                </h3>
                <span class="text-[#8c938f] text-[11px] select-none">♦</span>
            </div>
            <div class="dial-container-large" id="dial-clock">
                <div class="hotspot-large pos-1 time-slot" onclick="toggleTime(1)"></div>
                <div class="hotspot-large pos-2 time-slot" onclick="toggleTime(2)"></div>
                <div class="hotspot-large pos-3 time-slot" onclick="toggleTime(3)"></div>
                <div class="hotspot-large pos-4 time-slot" onclick="toggleTime(4)"></div>
                <div class="hotspot-large pos-5 time-slot" onclick="toggleTime(5)"></div>
                <div class="hotspot-large pos-6 time-slot" onclick="toggleTime(6)"></div>
            </div>
        </div>

    </main>

    <!-- NAVEGAÇÃO INFERIOR -->
    <nav class="fixed bottom-0 w-full z-30 bg-[#070908]/95 backdrop-blur-md border-t border-[#1a211e] pb-safe shadow-[0_-4px_20px_rgba(0,0,0,1)] flex-shrink-0">
        <div id="bottom-nav-bar" class="bottom-nav-container"></div>
    </nav>

    <!-- MODAL DE EDIÇÃO -->
    <div id="text-modal" class="fixed inset-0 z-50 bg-[#000000]/85 backdrop-blur-sm flex items-center justify-center p-4 hidden" onclick="if(event.target === this) closeTextModal()">
        <div class="bg-[#090b0a] border border-[#2b3630] rounded-sm p-5 w-full max-w-xs space-y-4 relative shadow-2xl" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between border-b border-[#1a211e] pb-2">
                <span id="text-modal-title" class="font-title text-[15px] text-[#c2a675] font-bold uppercase tracking-widest">Editar</span>
            </div>
            <div id="modal-chapter-wrapper" class="hidden">
                <input type="text" id="modal-chapter-input" class="modal-input" autocomplete="off" placeholder="Nº">
            </div>
            <div id="modal-part-wrapper" class="hidden flex items-center justify-between gap-3">
                <div class="flex flex-col flex-1">
                    <label class="font-sans text-[10px] text-[#6d7872] uppercase tracking-widest mb-1.5 text-center font-bold">Ramo</label>
                    <input type="text" id="modal-ramo-input" class="modal-input" autocomplete="off" placeholder="A">
                </div>
                <div class="flex flex-col items-center pt-5"><span class="font-title text-[24px] text-[#4a5550] font-bold">:</span></div>
                <div class="flex flex-col flex-1">
                    <label class="font-sans text-[10px] text-[#6d7872] uppercase tracking-widest mb-1.5 text-center font-bold">Parte</label>
                    <input type="number" id="modal-parte-input" class="modal-input" autocomplete="off" placeholder="1">
                </div>
            </div>
            <button type="button" onclick="saveTextModal()" class="w-full bg-[#101613] hover:bg-[#141c17] border border-[#2b3630] hover:border-[#c2a675] text-[#c2a675] font-title font-bold uppercase tracking-widest py-2.5 rounded-sm transition-all shadow-md mt-2">
                Confirmar
            </button>
        </div>
    </div>

    <script>
        const storedPlayer = localStorage.getItem('active_player');
        const storedCampaign = localStorage.getItem('active_campaign');
        let userRole = 'cronista';
        if (storedPlayer && !storedCampaign) { userRole = 'jogador'; }

        function renderBottomNav() {
            const navContainer = document.getElementById('bottom-nav-bar');
            if (!navContainer) return;

            if (userRole === 'cronista') {
                navContainer.innerHTML = `
                    <a href="cronica.html" class="bottom-nav-item text-[#c2a675]">
                        <span class="material-symbols-rounded text-[26px]">hourglass_bottom</span>
                        <span class="bottom-nav-label">Crônica</span>
                    </a>
                    <a href="condicoes.html" class="bottom-nav-item text-[#6d7872] hover:text-[#b8b4a7]">
                        <span class="material-symbols-rounded text-[26px]">library_books</span>
                        <span class="bottom-nav-label">Condições</span>
                    </a>
                    <a href="diario.html" class="bottom-nav-item text-[#6d7872] hover:text-[#b8b4a7]">
                        <span class="material-symbols-rounded text-[26px]">history_edu</span>
                        <span class="bottom-nav-label">Diário</span>
                    </a>
                    <a href="grupo.html" class="bottom-nav-item text-[#6d7872] hover:text-[#b8b4a7]">
                        <span class="material-symbols-rounded text-[26px]">groups_2</span>
                        <span class="bottom-nav-label">Grupo</span>
                    </a>
                    <a href="salvar.html" class="bottom-nav-item text-[#6d7872] hover:text-[#b8b4a7]">
                        <span class="material-symbols-rounded text-[26px]">book_6</span>
                        <span class="bottom-nav-label">Salvar</span>
                    </a>
                `;
            } else {
                navContainer.innerHTML = `
                    <a href="cronica.html" class="bottom-nav-item text-[#c2a675]">
                        <span class="material-symbols-rounded text-[26px]">hourglass_bottom</span>
                        <span class="bottom-nav-label">Crônica</span>
                    </a>
                    <a href="condicoes.html" class="bottom-nav-item text-[#6d7872] hover:text-[#b8b4a7]">
                        <span class="material-symbols-rounded text-[26px]">library_books</span>
                        <span class="bottom-nav-label">Condições</span>
                    </a>
                    <a href="diario.html" class="bottom-nav-item text-[#6d7872] hover:text-[#b8b4a7]">
                        <span class="material-symbols-rounded text-[26px]">history_edu</span>
                        <span class="bottom-nav-label">Diário</span>
                    </a>
                    <a href="grupo.html" class="bottom-nav-item text-[#6d7872] hover:text-[#b8b4a7]">
                        <span class="material-symbols-rounded text-[26px]">sports_martial_arts</span>
                        <span class="bottom-nav-label">Personagem</span>
                    </a>
                    <a href="exportar.html" class="bottom-nav-item text-[#6d7872] hover:text-[#b8b4a7]">
                        <span class="material-symbols-rounded text-[26px]">share</span>
                        <span class="bottom-nav-label">Exportar</span>
                    </a>
                `;
            }
        }

        /* Lógica do Tempo e Capítulos */
        let currentChapter = "1";
        let currentPart = "A:1";
        let timeMarks = new Set(); 
        let editingMode = null; 

        function adjustChapter(delta) {
            let num = parseInt(currentChapter);
            if (isNaN(num)) num = 1;
            num += delta;
            if (num < 1) num = 1;
            currentChapter = num.toString();
            document.getElementById('chapter-val').innerText = currentChapter;
        }

        function adjustPart(delta) {
            let val = currentPart;
            let match = val.match(/(\d+)$/);
            if (match) {
                let num = parseInt(match[0]) + delta;
                if (num < 1) num = 1;
                val = val.substring(0, match.index) + num;
            } else if (!isNaN(parseInt(val))) {
                let num = parseInt(val) + delta;
                if(num < 1) num = 1;
                val = num.toString();
            }
            currentPart = val;
            document.getElementById('part-val').innerText = currentPart;
        }

        function openTextModal(mode) {
            editingMode = mode;
            const modal = document.getElementById('text-modal');
            const title = document.getElementById('text-modal-title');
            const chapWrapper = document.getElementById('modal-chapter-wrapper');
            const partWrapper = document.getElementById('modal-part-wrapper');
            
            if (mode === 'chapter') {
                title.innerText = 'CAPÍTULO';
                chapWrapper.classList.remove('hidden');
                partWrapper.classList.add('hidden');
                document.getElementById('modal-chapter-input').value = currentChapter;
            } else {
                title.innerText = 'CÓDIGO DA PARTE';
                chapWrapper.classList.add('hidden');
                partWrapper.classList.remove('hidden');
                let parts = currentPart.split(':');
                if (parts.length >= 2) {
                    document.getElementById('modal-ramo-input').value = parts[0];
                    document.getElementById('modal-parte-input').value = parts[1];
                } else {
                    document.getElementById('modal-ramo-input').value = currentPart;
                    document.getElementById('modal-parte-input').value = '1';
                }
            }
            modal.classList.remove('hidden');
            if (mode === 'chapter') { setTimeout(() => document.getElementById('modal-chapter-input').focus(), 100); } 
            else { setTimeout(() => document.getElementById('modal-ramo-input').focus(), 100); }
        }

        function closeTextModal() { document.getElementById('text-modal').classList.add('hidden'); }

        function saveTextModal() {
            if (editingMode === 'chapter') {
                const val = document.getElementById('modal-chapter-input').value.trim();
                if (val !== "") {
                    currentChapter = val;
                    document.getElementById('chapter-val').innerText = currentChapter;
                }
            } else if (editingMode === 'part') {
                const ramo = document.getElementById('modal-ramo-input').value.trim().toUpperCase() || 'A';
                const parte = document.getElementById('modal-parte-input').value.trim() || '1';
                currentPart = `${ramo}:${parte}`;
                document.getElementById('part-val').innerText = currentPart;
            }
            closeTextModal();
        }

        function toggleTime(num) {
            const btns = document.querySelectorAll('.time-slot');
            if (timeMarks.has(num)) {
                timeMarks.delete(num); btns[num - 1].classList.remove('filled');
            } else {
                timeMarks.add(num); btns[num - 1].classList.add('filled');
            }
        }

        /* Lógica do Popover de Ecos */
        let isPlaying = false;
        let isMuffled = false;
        let preMuffleVolume = 80;

        function togglePlayerMenu() {
            const panel = document.getElementById('player-panel');
            const overlay = document.getElementById('player-overlay');
            if (panel.classList.contains('opacity-0')) {
                overlay.style.display = 'block';
                panel.classList.remove('opacity-0', 'scale-95', 'pointer-events-none');
                panel.classList.add('opacity-100', 'scale-100', 'pointer-events-auto');
            } else {
                overlay.style.display = 'none';
                panel.classList.remove('opacity-100', 'scale-100', 'pointer-events-auto');
                panel.classList.add('opacity-0', 'scale-95', 'pointer-events-none');
            }
        }

        function togglePlayState() {
            isPlaying = !isPlaying;
            const icon = document.getElementById('play-icon');
            icon.innerText = isPlaying ? "pause" : "play_arrow";
        }

        function toggleMuffle() {
            const muffleBtn = document.getElementById('muffle-btn');
            const volSlider = document.getElementById('vol-slider');
            isMuffled = !isMuffled;
            if(isMuffled) {
                preMuffleVolume = volSlider.value;
                volSlider.value = 15; 
                muffleBtn.classList.add('active');
            } else {
                volSlider.value = preMuffleVolume; 
                muffleBtn.classList.remove('active');
            }
        }

        function updateVolume(val) {
            if(isMuffled) {
                isMuffled = false;
                document.getElementById('muffle-btn').classList.remove('active');
            }
        }

        window.onload = () => { renderBottomNav(); };
    </script>
</body>
</html>
