<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kings of Ruin · Ícones</title>
<link rel="stylesheet" href="theme.css">
<style>
.page { padding-bottom: 96px; }
.slot-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 8px 4px 8px 8px; border-bottom: 1px solid var(--line); text-align: left; }
.slot-row:active { background: var(--card-raised); }
.slot-row .cur { width: 48px; height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line-control); border-radius: var(--radius); background: #060807; color: var(--gold); }
.slot-row .cur .ms { font-size: 2rem; }
.slot-row .info { flex: 1; min-width: 0; }
.slot-row .info .t-title { font-size: .9375rem; display: block; }
.slot-row .changed { color: var(--gold); font-style: normal; font-weight: 600; }
.search-row { display: flex; gap: 8px; margin-bottom: 10px; }
.results { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
.res { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 1px solid var(--line); border-radius: var(--radius); background: #060807; color: var(--text); padding: 4px; min-height: 64px; }
.res .ms { font-size: 1.9rem; }
.res small { font-size: .5625rem; color: var(--text-3); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res[aria-pressed="true"] { border-color: var(--gold); background: var(--card-selected); color: var(--gold); }
.res:active { background: var(--card-raised); }
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 10px 12px; background: rgba(7,9,8,.97); border-top: 1px solid var(--line); display: flex; justify-content: center; }
.bar > div { width: 100%; max-width: 30rem; display: flex; align-items: center; gap: 10px; }
.bar .btn { flex: 1; }
textarea.field { min-height: 200px; font-family: ui-monospace, monospace; font-size: .8125rem; resize: none; }
</style>
</head>
<body class="ms-raw">
<main class="page no-nav">
    <h1 class="t-title" style="text-align:center;font-size:1.1rem;letter-spacing:.15em;text-transform:uppercase;margin:6px 0 4px">Ícones temáticos</h1>
    <p class="t-meta" style="text-align:center;margin:0 0 14px">Toque em um ícone para buscar outro no game-icons. A troca vale na hora, só no lugar escolhido (o mesmo desenho em outra tela não muda junto).</p>
    <div id="list"></div>
    <p class="t-meta" style="text-align:center;margin:20px 0 0">Ícones utilitários (voltar, fechar, ⋮, engrenagem…) seguem no Material.<br>Catálogo completo: <a href="https://game-icons.net" target="_blank" rel="noopener" style="color:var(--gold);text-decoration:underline">game-icons.net</a> · CC BY 3.0</p>
</main>
<div class="bar"><div><span class="t-label" id="count" style="white-space:nowrap"></span><button class="btn primary" id="export"><span class="ms outline" style="font-size:1.2rem">content_copy</span>Copiar trocas</button></div></div>

<script src="app.js"></script>
<script>
KR.header({ back: 'config.html', player: false });
const $ = id => document.getElementById(id);
// por tela: cada linha é um lugar independente; repetir o desenho em outra tela não liga as trocas
const SECTIONS = [
    ['Menu inferior', [['cronica', 'Crônica'], ['condicoes', 'Condições'], ['diario', 'Diário'], ['grupo', 'Grupo'], ['personagem', 'Personagem (modo jogador)'], ['salvar', 'Salvar'], ['exportar', 'Exportar (modo jogador)']]],
    ['Nova campanha', [['n_solo', 'Modo solo'], ['n_multi', 'Multiplayer'], ['n_cronista', 'Papel Cronista'], ['n_jogador', 'Papel Jogador'], ['h_elgan', 'Elgan · o Candelário'], ['h_gerdwyn', 'Gerdwyn · a Mercenária'], ['h_iunis', 'Iunis · a Gladiatrix'], ['h_osbert', 'Osbert · o Bufão'], ['n_narrativo', 'Aba Narrativo (modificadores)'], ['n_desafiador', 'Aba Desafiador (modificadores)']]],
    ['Continuar', [['c_campanhas', 'Aba Campanhas'], ['c_fichas', 'Aba Fichas'], ['c_elgan', 'Ficha salva · Elgan'], ['c_gerdwyn', 'Ficha salva · Gerdwyn'], ['c_iunis', 'Ficha salva · Iunis'], ['c_osbert', 'Ficha salva · Osbert']]],
    ['Ficha do herói (grupo)', [['t_status', 'Aba Status'], ['t_attrs', 'Aba Atributos'], ['t_itens', 'Aba Itens'], ['t_cartas', 'Aba Cartas'], ['t_ecos', 'Aba Ecos'], ['combate', 'Cartas · Combate'], ['diplomacia', 'Cartas · Diplomacia'], ['lendaria', 'Ecos · Ação lendária'], ['secreta', 'Ecos · Carta secreta bloqueada'], ['evoluida', 'Ecos · Habilidade evoluída'], ['bloqueada', 'Ecos · Habilidade evoluída bloqueada']]],
    ['Diário', [['d_todos', 'Fitilho Todos'], ['d_local', 'Fitilho Local'], ['d_npc', 'Fitilho NPC'], ['d_demanda', 'Fitilho Demanda'], ['d_personagem', 'Fitilho Personagem'], ['d_nova', 'Botão nova anotação']]],
    ['Salvar', [['s_herois', 'Aba Heróis'], ['s_criaturas', 'Aba Criaturas'], ['s_mapa', 'Aba Mapa'], ['s_caixa', 'Aba Caixa'], ['s_resumo', 'Aba Resumo'], ['s_padrons', 'Padrons'], ['s_monarcas', 'Monarcas'], ['s_companheiros', 'Companheiros'], ['s_guardioes', 'Guardiões'], ['s_claro', 'Token tempo claro'], ['s_escuro', 'Token tempo escuro'], ['s_demanda', 'Token demanda'], ['s_universal', 'Cubo universal'], ['s_botao', 'Botão Salvar jogo']]],
    ['Player de música', [['pl_musica', 'Ecos de Ruína'], ['pl_combate', 'Sangue e Gelo (combate)'], ['pl_exploracao', 'Névoa Espessa (exploração)'], ['pl_taverna', 'Taverna do Chifre']]],
    ['Configurações · catálogo de ecos', [['cf_musica', 'Ecos de Ruína'], ['cf_combate', 'Sangue e Gelo (combate)'], ['cf_exploracao', 'Névoa Espessa (exploração)'], ['cf_taverna', 'Taverna do Chifre']]]
];
const overrides = KR.get('iconOverrides', {});
const current = slot => overrides[slot] || KR.GAME_ICONS[slot];

function render() {
    $('list').innerHTML = SECTIONS.map(([sec, rows]) => `<div class="section-head" style="margin-top:20px"><span class="t-title">${sec}</span></div>` + rows.map(([slot, lb]) => `
        <button class="slot-row" data-slot="${slot}">
            <span class="cur">${KR.gi(slot)}</span>
            <span class="info"><span class="t-title">${lb}</span><span class="t-meta">${current(slot)}${overrides[slot] ? ` <span class="changed">· trocado (padrão: ${KR.GAME_ICONS[slot]})</span>` : ''}</span></span>
            <span class="ms" style="color:var(--text-3)">chevron_right</span>
        </button>`).join('')).join('');
    $('count').textContent = `${Object.keys(overrides).length} troca(s)`;
}

function openPicker(slot, label) {
    const { el, close } = KR.sheet(`
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><div class="t-title" style="color:var(--gold)">${KR.esc(label)}</div><button class="icon-btn" data-close aria-label="Fechar"><span class="ms">close</span></button></div>
        <form class="search-row" id="pk-form"><input class="field" id="pk-q" placeholder="Buscar em inglês (sword, candle…)" autocomplete="off" value="${KR.esc(current(slot).replace(/-/g, ' '))}"><button class="btn" type="submit" aria-label="Buscar"><span class="ms">search</span></button></form>
        <div class="t-meta" id="pk-msg" style="margin-bottom:8px"></div>
        <div class="results" id="pk-res"></div>
        ${overrides[slot] ? `<button class="btn block" id="pk-reset" style="margin-top:12px"><span class="ms outline" style="font-size:1.2rem">restart_alt</span>Voltar ao padrão (${KR.GAME_ICONS[slot]})</button>` : ''}`);
    const q = el.querySelector('#pk-q'), res = el.querySelector('#pk-res'), msg = el.querySelector('#pk-msg');
    const search = async () => {
        const term = q.value.trim(); if (!term) return;
        msg.textContent = 'Buscando…'; res.innerHTML = '';
        try {
            const r = await fetch(`https://api.iconify.design/search?query=${encodeURIComponent(term)}&prefix=game-icons&limit=96`);
            const names = ((await r.json()).icons || []).map(n => n.replace('game-icons:', ''));
            msg.textContent = names.length ? `${names.length} resultado(s) para "${term}"` : `Nada para "${term}". Tente outra palavra em inglês.`;
            if (!names.length) {
                // o nome pode ser de outro pacote do Iconify (ex.: hourglass-circle é do Pepicons)
                const other = ((await (await fetch(`https://api.iconify.design/search?query=${encodeURIComponent(term)}&limit=32`)).json()).icons || []);
                const packs = [...new Set(other.map(n => n.split(':')[0]))];
                if (packs.length) msg.textContent = `"${term}" não existe no game-icons; aparece em outro pacote (${packs.slice(0, 3).join(', ')}). Busque dentro de icon-sets.iconify.design/game-icons.`;
            }
            res.innerHTML = names.map(n => `<button class="res" data-name="${n}" aria-pressed="${n === current(slot)}" aria-label="${n}"><iconify-icon class="ms gi" icon="game-icons:${n}" aria-hidden="true"></iconify-icon><small>${n}</small></button>`).join('');
        } catch { msg.textContent = 'Sem conexão com o catálogo de ícones.'; }
    };
    el.querySelector('#pk-form').onsubmit = e => { e.preventDefault(); search(); };
    res.onclick = e => {
        const b = e.target.closest('[data-name]'); if (!b) return;
        const n = b.dataset.name;
        if (n === KR.GAME_ICONS[slot]) delete overrides[slot]; else overrides[slot] = n;
        KR.set('iconOverrides', overrides); render(); close();
        KR.snackbar(`${label}: ${n}`);
    };
    el.querySelector('#pk-reset')?.addEventListener('click', () => { delete overrides[slot]; KR.set('iconOverrides', overrides); render(); close(); });
    search();
}

$('list').addEventListener('click', e => {
    const b = e.target.closest('[data-slot]'); if (!b) return;
    openPicker(b.dataset.slot, b.querySelector('.info .t-title').textContent);
});

$('export').onclick = async () => {
    const text = Object.keys(overrides).length
        ? Object.entries(overrides).map(([slot, n]) => `${slot}: ${KR.GAME_ICONS[slot]} -> ${n}`).join('\n')
        : 'Nenhuma troca: manter todos os ícones padrão.';
    try { await navigator.clipboard.writeText(text); KR.snackbar('Trocas copiadas · cole na conversa'); return; } catch {}
    // http na rede local não tem acesso à área de transferência: mostra o texto para copiar à mão
    const { el } = KR.sheet(`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><div class="t-title" style="color:var(--gold)">Suas trocas</div><button class="icon-btn" data-close aria-label="Fechar"><span class="ms">close</span></button></div>
        <p class="t-meta" style="margin:0 0 8px">Segure no texto, selecione tudo e copie.</p>
        <textarea class="field" readonly>${KR.esc(text)}</textarea>`);
    const ta = el.querySelector('textarea'); ta.focus(); ta.select();
};

render();
</script>
</body>
</html>
