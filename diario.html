<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kings of Ruin - Diário</title>
    
    <!-- Tipografia -->
    <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@600;700&family=Crimson+Pro:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Google Material Symbols Rounded -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" rel="stylesheet" />
    
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root { 
            --font-celtic: 'Celtic Garamond', 'Crimson Pro', serif; 
            --font-title: 'Cinzel', serif;
            --font-ui: 'Alegreya Sans', sans-serif;
        }

        /* Configuração Base para os Ícones Material */
        .material-symbols-rounded { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; display: inline-block; vertical-align: middle; line-height: 1; }
        .icon-outlined { font-variation-settings: 'FILL' 0, 'wght' 600, 'GRAD' 0, 'opsz' 24; }

        body {
            background-color: transparent; color: #b8b4a7; -webkit-tap-highlight-color: transparent;
            font-family: var(--font-celtic); overflow-x: hidden; position: relative; margin: 0; padding: 0; font-size: 16px;
        }

        body::after {
            content: ""; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: linear-gradient(rgba(7, 9, 8, 0.9), rgba(7, 9, 8, 0.96)), url('https://lh3.googleusercontent.com/d/1CVTwNLqVBc4Y97ZD82hIaf4wJnPeK4-L');
            background-size: cover; background-position: center; pointer-events: none; z-index: -2;
        }

        ::-webkit-scrollbar { display: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        h1, h2, h3, .font-title { font-family: var(--font-title) !important; }
        .font-sans { font-family: var(--font-ui) !important; }
        .font-celtic { font-family: var(--font-celtic) !important; }

        .site-header {
            background: linear-gradient(180deg, rgba(7, 9, 8, 0.95) 0%, rgba(7, 9, 8, 0.85) 100%);
            border-bottom: 1px solid rgba(43, 54, 48, 0.5); padding: 8px 16px; display: flex;
            justify-content: space-between; align-items: center; position: relative; z-index: 50;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .header-logo-img { height: clamp(44px, 11vw, 54px); width: auto; max-width: 260px; object-fit: contain; display: block; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.7)); }

        /* BOTÃO ECOS */
        .music-player-slot {
            display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 6px;
            background: #060807; border: 1px solid #2b3630; border-radius: 9999px;
            color: #c2a675; font-family: var(--font-ui); font-size: clamp(0.7rem, 2.5vw, 0.8rem);
            font-weight: bold; letter-spacing: 0.1em; text-transform: uppercase;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.9), 0 2px 6px rgba(0,0,0,0.6); cursor: pointer; transition: all 0.2s ease;
        }
        .music-player-slot:hover { border-color: #c2a675; background: #0a0d0b; }
        .music-player-icon {
            background: #1a211e; color: #c2a675; width: 26px; height: 26px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; border: 1px solid #2b3630;
        }

        /* PLAYER FLUTUANTE (POPOVER) */
        .player-popover {
            background: linear-gradient(180deg, #111613 0%, #050706 100%); border: 1px solid #2b3630;
            border-top: 1px solid #3a453f; border-radius: 4px; width: 320px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9), 0 0 15px rgba(194, 166, 117, 0.05);
            position: absolute; top: 70px; right: 16px; z-index: 60; overflow: hidden;
            transform-origin: top right; transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .player-artwork-glow { width: 72px; height: 72px; border-radius: 50%; background: radial-gradient(circle, rgba(194, 166, 117, 0.15) 0%, transparent 70%); display: flex; align-items: center; justify-content: center; border: 1px solid rgba(194, 166, 117, 0.2); box-shadow: 0 0 15px rgba(0,0,0,0.5); flex-shrink: 0; }
        .player-ctrl-btn { color: #8c938f; background: transparent; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; padding: 0; }
        .player-ctrl-btn:hover { color: #c2a675; transform: scale(1.05); }
        .player-ctrl-btn:active { transform: scale(0.95); }
        .player-play-btn { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #d4b886 0%, #9c7f4c 100%); color: #060807; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.6), inset 1px 1px 2px rgba(255,255,255,0.4); border: 2px solid #111613; cursor: pointer; transition: all 0.2s; }
        .player-play-btn:hover { filter: brightness(1.1); box-shadow: 0 4px 15px rgba(194,166,117,0.4); }
        .player-play-btn:active { transform: scale(0.95); }
        .player-muffle-btn { padding: 4px 12px; border: 1px solid #2b3630; border-radius: 999px; font-family: var(--font-ui); font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.1em; color: #8c938f; background: #090b0a; cursor: pointer; transition: all 0.2s; }
        .player-muffle-btn.active { background: #1a211e; color: #c2a675; border-color: #c2a675; box-shadow: 0 0 8px rgba(194,166,117,0.2); }
        .player-overlay { position: fixed; inset: 0; z-index: 45; display: none; }
        
        .config-select { background: #050706; border: 1px solid #2b3630; color: #b8b4a7; outline: none; font-family: var(--font-title); border-radius: 3px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.9); padding: 0 10px; appearance: none; }
        .custom-slider { -webkit-appearance: none; appearance: none; width: 100%; background: transparent; outline: none; margin: 0; padding: 10px 0; }
        .custom-slider::-webkit-slider-runnable-track { width: 100%; height: 8px; background: #050706; border: 1px solid #7a6345; border-radius: 4px; box-shadow: inset 0 1px 4px rgba(0,0,0,1); }
        .custom-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; background: linear-gradient(135deg, #d4b886 0%, #9c7f4c 100%); border: 2px solid #111613; border-radius: 3px; cursor: pointer; transform: rotate(45deg); box-shadow: 3px 3px 6px rgba(0,0,0,0.8), inset 1px 1px 2px rgba(255,255,255,0.4); margin-top: -7px; transition: transform 0.1s; }

        /* BUSCA (A BARRA FICA POR CIMA DOS FITILHOS) */
        .search-container {
            position: relative;
            margin: 12px 16px 0 16px;
        }
        .search-input-classic {
            background: transparent;
            border: none;
            border-bottom: 1px solid #2b3630;
            color: #c2a675;
            font-family: var(--font-celtic);
            font-size: 1.15rem;
            width: 100%;
            padding: 6px 32px 6px 4px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            border-radius: 0;
            text-align: center;
        }
        .search-input-classic::placeholder { color: #3a453f; font-style: italic; }
        .search-input-classic:focus { border-bottom-color: #c2a675; box-shadow: 0 1px 0 0 #c2a675; }
        .search-icon-classic {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            color: #4a5550;
            font-size: 1.2rem;
            pointer-events: none;
        }

        /* SISTEMA TÁTIL DE FITILHOS (FILTROS) CENTRALIZADO */
        .ribbon-filters {
            display: flex;
            justify-content: center;
            gap: 6px;
            padding: 0 12px;
            margin-top: -2px; 
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.7));
        }
        .filter-ribbon {
            width: clamp(56px, 18vw, 70px);
            height: 58px; /* Altura fixa para controlar perfeitamente o eixo vertical */
            padding: 8px 2px 14px 2px; 
            clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 82%, 0 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Centraliza perfeitamente o conteúdo no meio da fita */
            gap: 2px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateY(-12px); 
            opacity: 0.5;
            border: none;
        }
        .filter-ribbon.active {
            transform: translateY(0); 
            opacity: 1;
        }
        .filter-ribbon span.material-symbols-rounded { 
            font-size: 20px !important; 
            line-height: 1;
        }
        .filter-ribbon span:not(.material-symbols-rounded) { 
            color: #b8b4a7; 
            font-size: 9px; 
            font-family: var(--font-ui); 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            font-weight: bold;
        }
        .filter-ribbon span:not(.material-symbols-rounded) { 
            color: #b8b4a7; 
            font-size: 9px; 
            font-family: var(--font-ui); 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            font-weight: bold;
        }
        
        .ribbon-all { background: linear-gradient(180deg, #1f2722, #0d120f); }
        .ribbon-local { background: linear-gradient(180deg, #1e3a5f, #0d1b2e); }
        .ribbon-npc { background: linear-gradient(180deg, #243b29, #102115); }
        .ribbon-demanda { background: linear-gradient(180deg, #5c4022, #291a0c); }
        .ribbon-personagem { background: linear-gradient(180deg, #3d284a, #1d1024); }

        /* MÁSCARA DE ESMAECIMENTO (FADE-OUT) NO SCROLL REFINADA */
        .journal-scroll-wrapper {
            flex: 1;
            overflow-y: auto;
            width: 100%;
            padding-bottom: 6rem;
            margin-top: -16px;
            padding-top: 16px;
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,1) 12px);
            mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,1) 12px);
        }

        /* ESTÉTICA DE CÓDICE (LIVRO) PARA NOTAS */
        .journal-container {
            padding: 24px 12px 0 12px; 
        }
        
        .chapter-divider {
            position: relative;
            text-align: center;
            margin: 16px 0 20px 0;
        }
        .chapter-divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #1f2722;
            z-index: 1;
        }
        .chapter-title-box {
            position: relative;
            z-index: 2;
            background: #070908;
            padding: 0 12px;
            display: inline-block;
            font-family: var(--font-title);
            font-size: 16px;
            font-weight: bold;
            color: #c2a675;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }
        .chapter-title-box::before, .chapter-title-box::after {
            content: "✦";
            font-size: 10px;
            color: #4a5550;
            vertical-align: middle;
            margin: 0 6px;
        }

        .journal-entry {
            background: rgba(9, 11, 10, 0.4);
            border-left: 2px solid #1a211e;
            padding: 14px 14px 44px 14px;
            margin-bottom: 24px;
            position: relative;
            transition: border-color 0.3s;
        }
        .journal-entry:hover { border-left-color: #2b3630; }
        
        /* FITILHOS DAS TAGS (DENTRO DA NOTA) */
        .tags-container {
            position: absolute;
            top: -1px;
            right: 16px;
            display: flex;
            gap: 6px;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.8));
            z-index: 5;
        }
        .fitilho {
            width: 24px;
            height: 32px;
            display: flex;
            justify-content: center;
            padding-top: 5px;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 82%, 0 100%);
            border-top: 1px solid rgba(194, 166, 117, 0.4);
        }
        .fitilho-local { background: linear-gradient(180deg, #1e3a5f, #112238); }
        .fitilho-npc { background: linear-gradient(180deg, #243b29, #132417); }
        .fitilho-demanda { background: linear-gradient(180deg, #5c4022, #382410); }
        .fitilho-personagem { background: linear-gradient(180deg, #3d284a, #23152e); }

        .entry-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid #141a17;
            padding-bottom: 6px;
            margin-bottom: 10px;
            padding-right: 60px;
        }
        
        .journal-actions {
            position: absolute;
            bottom: 8px;
            right: 8px;
            display: flex;
            gap: 6px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .journal-entry:hover .journal-actions { opacity: 1; }
        
        .action-btn {
            color: #6d7872;
            transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
            border-radius: 3px;
            width: 28px; height: 28px;
            border: 1px solid transparent;
            background: transparent;
        }
        .action-btn:hover { color: #c2a675; background: rgba(0,0,0,0.4); }
        .action-btn.del:hover { color: #ff6b6b; background: rgba(69, 6, 6, 0.4); }

        /* Aninhamento (Desdobramentos) */
        .reply-card {
            background: transparent;
            border-left: 1px solid #2b3630;
            padding-left: 12px;
            margin-top: 14px;
            margin-left: 8px;
            padding-bottom: 34px;
            position: relative;
        }
        
        .reply-action-btn {
            position: absolute;
            bottom: 12px;
            left: 14px;
            font-size: 11.5px;
            font-family: var(--font-ui);
            font-weight: bold;
            color: #6d7872;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: color 0.2s;
            background: transparent;
            border: none;
            padding: 0;
        }
        .reply-action-btn:hover { color: #c2a675; }

        .delete-confirm {
            background-color: #9e1515 !important;
            border-color: #ff3333 !important;
            color: #ffffff !important;
            animation: pulse-red 1s infinite;
        }
        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0.7); }
            50% { box-shadow: 0 0 0 4px rgba(255, 51, 51, 0); }
        }

        /* FAB */
        .fab-btn {
            position: fixed;
            bottom: 80px; 
            right: 16px;
            width: 56px;
            height: 56px;
            background: #090b0a;
            border: 1px solid #c2a675;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c2a675;
            box-shadow: 0 4px 15px rgba(0,0,0,0.9), inset 0 0 10px rgba(0,0,0,0.6);
            cursor: pointer;
            z-index: 40;
            transition: all 0.2s;
        }
        .fab-btn:hover, .fab-btn:active {
            background: #141c17;
            color: #fff;
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(194, 166, 117, 0.3);
        }

        /* MODAL */
        .modal-input-small {
            background: rgba(0,0,0,0.5);
            border: 1px solid #2b3630;
            color: #c2a675;
            font-family: var(--font-title);
            font-size: 1.05rem;
            padding: 6px 8px;
            border-radius: 3px;
            outline: none;
            width: 100%;
            text-align: center;
        }
        .modal-input-small:focus { border-color: #c2a675; }

        .modal-textarea {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid #2b3630;
            color: #b8b4a7;
            font-family: var(--font-celtic);
            font-size: 1.15rem;
            padding: 10px 12px;
            border-radius: 3px;
            outline: none;
            resize: none;
            min-height: 140px;
            transition: border-color 0.2s;
            line-height: 1.4;
        }
        .modal-textarea:focus { border-color: #c2a675; background: rgba(0,0,0,0.8); }

        /* TAGS NO MODAL */
        .tag-toggle-btn {
            background: #060807;
            border: 1px solid #1f2722;
            color: #4a5550;
            padding: 8px 10px;
            border-radius: 3px;
            font-family: var(--font-ui);
            font-size: 11.5px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex: 1;
        }
        .tag-toggle-btn.active {
            background: #0a0d0b;
            border-color: #c2a675;
            color: #b8b4a7;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .tag-toggle-btn.active.tgt-local span { color: #8fa3b0; }
        .tag-toggle-btn.active.tgt-npc span { color: #8e9e8f; }
        .tag-toggle-btn.active.tgt-demanda span { color: #b59a82; }
        .tag-toggle-btn.active.tgt-personagem span { color: #a38ea8; }

        /* NAVEGAÇÃO INFERIOR */
        .bottom-nav-container {
            display: flex; justify-content: center; align-items: center;
            height: 4rem; width: 100%; max-width: 512px; margin: 0 auto;
            gap: clamp(2px, 1.5vw, 12px); padding: 0 4px;
        }
        .bottom-nav-item {
            width: clamp(54px, 18vw, 76px); flex-shrink: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100%; padding: 0 2px; transition: color 0.2s;
        }
        .bottom-nav-label {
            font-size: clamp(10px, 2.7vw, 12px); font-family: var(--font-ui); text-transform: uppercase;
            font-weight: 700; letter-spacing: 0.01em; white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; width: 100%; text-align: center; margin-top: 2px; line-height: 1;
        }
    </style>
</head>
<body class="h-screen flex flex-col">

    <header class="site-header flex-shrink-0">
        <img src="https://lh3.googleusercontent.com/d/1U3juHgIiAcpfSSQiW3nWN20MhMUx7tJR" alt="Kings of Ruin" class="header-logo-img">
        <div class="flex items-center gap-3">
            <div class="music-player-slot" title="Controle de Áudio" onclick="togglePlayerMenu()">
                <div class="music-player-icon"><span class="material-symbols-rounded text-[14px] animate-pulse">music_note_2</span></div>
                <span>Ecos</span>
            </div>
            <a href="config.html" class="text-[#6d7872] hover:text-[#c2a675] transition-colors p-1 flex items-center justify-center" title="Configurações">
                <span class="material-symbols-rounded text-[26px]">settings</span>
            </a>
        </div>
    </header>

    <!-- OVERLAY E PLAYER ECOS (POPOVER) -->
    <div id="player-overlay" class="player-overlay" onclick="togglePlayerMenu()"></div>
    <div id="player-panel" class="player-popover opacity-0 scale-95 pointer-events-none">
        <div class="p-5 flex flex-col items-center">
            <div class="flex items-center w-full gap-4 mb-5">
                <div class="player-artwork-glow">
                    <span class="material-symbols-rounded text-[32px] text-[#c2a675] opacity-80">speaker</span>
                </div>
                <div class="flex-1 min-w-0 flex flex-col gap-1.5">
                    <label class="text-[9px] font-sans uppercase font-bold text-[#6d7872]">Playlist Ativa</label>
                    <div class="relative w-full">
                        <select class="config-select !h-[30px] !text-[14px] !pr-8 !bg-[#060807] !border-[#2b3630]">
                            <option>Ecos de Ruína</option>
                            <option>Sangue e Gelo</option>
                        </select>
                        <span class="material-symbols-rounded icon-outlined absolute right-2.5 top-1/2 -translate-y-1/2 text-[#4a5550] pointer-events-none text-[18px]">arrow_drop_down</span>
                    </div>
                    <span class="font-sans text-[12px] text-[#e0d5c1] font-bold truncate mt-1">♪ Faixa 1: Vento Gélido</span>
                </div>
            </div>
            <div class="w-full mb-5 px-1">
                <div class="w-full h-1 bg-[#1a211e] rounded-full overflow-hidden">
                    <div class="w-1/3 h-full bg-[#c2a675] rounded-full"></div>
                </div>
                <div class="flex justify-between mt-1.5">
                    <span class="font-sans text-[10px] text-[#6d7872] font-bold">1:24</span>
                    <span class="font-sans text-[10px] text-[#6d7872] font-bold">-2:15</span>
                </div>
            </div>
            <div class="flex items-center justify-center gap-8 mb-6">
                <button class="player-ctrl-btn"><span class="material-symbols-rounded text-[32px]">skip_previous</span></button>
                <button class="player-play-btn" id="main-play-btn" onclick="togglePlayState()">
                    <span id="play-icon" class="material-symbols-rounded text-[28px]">play_arrow</span>
                </button>
                <button class="player-ctrl-btn"><span class="material-symbols-rounded text-[32px]">skip_next</span></button>
            </div>
            <div class="w-full pt-4 border-t border-[#141a17] space-y-4">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-rounded text-[#6d7872] text-[20px]">volume_down</span>
                    <input type="range" id="vol-slider" min="0" max="100" value="80" class="custom-slider flex-1" oninput="updateVolume(this.value)">
                    <span class="material-symbols-rounded text-[#c2a675] text-[20px]">volume_up</span>
                </div>
                <div class="flex justify-center">
                    <button id="muffle-btn" class="player-muffle-btn flex items-center justify-center gap-1" onclick="toggleMuffle()">
                        <span class="material-symbols-rounded icon-outlined text-[14px]">mic</span> Atenuar P/ Narrar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <main class="flex-1 flex flex-col w-full max-w-lg mx-auto z-10 overflow-hidden relative">
        
        <!-- CABEÇALHO DO DIÁRIO (Busca + Fitilhos Fixos) -->
        <div class="z-20 flex-shrink-0 relative pointer-events-auto">
            <div class="bg-[#070908]/95 backdrop-blur-md pt-1 pb-3 relative z-10 border-b border-[#1a211e] shadow-[0_4px_12px_rgba(0,0,0,0.5)]">
                <div class="search-container">
                    <input type="text" id="search-diary" class="search-input-classic" placeholder="Pesquisar nas memórias..." oninput="renderDiary()">
                    <span class="material-symbols-rounded search-icon-classic">search</span>
                </div>
            </div>
            
            <!-- Fitilhos com alinhamento flex corrigido -->
            <div class="ribbon-filters hide-scrollbar relative z-0">
                <button onclick="setFilter('all')" id="flt-all" class="filter-ribbon ribbon-all active" title="Todos os Registros">
                    <span class="material-symbols-rounded text-[#c2a675]">dashboard</span>
                    <span>Todos</span>
                </button>
                <button onclick="setFilter('local')" id="flt-local" class="filter-ribbon ribbon-local" title="Locais">
                    <span class="material-symbols-rounded text-[#c2a675]">place</span>
                    <span>Local</span>
                </button>
                <button onclick="setFilter('npc')" id="flt-npc" class="filter-ribbon ribbon-npc" title="NPCs">
                    <span class="material-symbols-rounded text-[#c2a675]">groups</span>
                    <span>NPC</span>
                </button>
                <button onclick="setFilter('demanda')" id="flt-demanda" class="filter-ribbon ribbon-demanda" title="Demandas">
                    <span class="material-symbols-rounded text-[#c2a675]">receipt_long</span>
                    <span>Demanda</span>
                </button>
                <button onclick="setFilter('personagem')" id="flt-personagem" class="filter-ribbon ribbon-personagem" title="Personagens">
                    <span class="material-symbols-rounded text-[#c2a675]">badge</span>
                    <span>Personagem</span>
                </button>
            </div>
        </div>

        <!-- FEED ESTILO CÓDICE/LIVRO -->
        <div id="main-scroll" class="journal-scroll-wrapper hide-scrollbar">
            <div id="diary-timeline" class="journal-container">
                <!-- Renderizado via JS -->
            </div>
        </div>

    </main>

    <!-- BOTÃO FLUTUANTE (FAB) -->
    <button onclick="openNoteModal()" class="fab-btn" title="Nova Anotação">
        <span class="material-symbols-rounded text-[28px]">history_edu</span>
    </button>

    <!-- NAVEGAÇÃO INFERIOR -->
    <nav class="fixed bottom-0 w-full z-30 bg-[#070908]/95 backdrop-blur-md border-t border-[#1a211e] pb-safe shadow-[0_-4px_20px_rgba(0,0,0,1)] flex-shrink-0">
        <div id="bottom-nav-bar" class="bottom-nav-container"></div>
    </nav>

    <!-- MODAL DE TEXTO -->
    <div id="note-modal" class="fixed inset-0 z-50 bg-[#000000]/85 backdrop-blur-sm flex items-center justify-center p-4 hidden" onclick="if(event.target === this) closeNoteModal()">
        <div class="bg-[#090b0a] border border-[#2b3630] rounded-sm p-4 w-full max-w-sm space-y-3 relative shadow-2xl" onclick="event.stopPropagation()">
            
            <div class="flex items-center justify-between border-b border-[#1a211e] pb-2">
                <span id="modal-title" class="font-title text-[15px] text-[#c2a675] font-bold flex items-center gap-2">
                    <span class="material-symbols-rounded text-[18px]">history_edu</span> Registro de Jornada
                </span>
                <button onclick="closeNoteModal()" class="text-[#6d7872] hover:text-[#c2a675] transition-colors">
                    <span class="material-symbols-rounded text-lg pointer-events-none">close</span>
                </button>
            </div>

            <div id="modal-time-context" class="flex items-center gap-2">
                <div class="flex-1">
                    <label class="text-[10px] font-sans uppercase font-bold text-[#8c938f] block mb-1">Capítulo</label>
                    <input type="number" id="input-chapter" class="modal-input-small" min="1" value="1">
                </div>
                <div class="flex-1">
                    <label class="text-[10px] font-sans uppercase font-bold text-[#8c938f] block mb-1">Parte</label>
                    <input type="text" id="input-part" class="modal-input-small" placeholder="ex: A:1">
                </div>
            </div>

            <textarea id="note-text-input" class="modal-textarea" placeholder="O que aconteceu?..."></textarea>

            <div id="modal-tags-section">
                <span class="text-[10px] font-sans uppercase font-bold text-[#8c938f] block mb-1.5">Anexar Fitilho (Opcional)</span>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" onclick="toggleModalTag('local', this)" class="tag-toggle-btn tgt-local" data-tag="local">
                        <span class="material-symbols-rounded text-[16px]">place</span> Local
                    </button>
                    <button type="button" onclick="toggleModalTag('npc', this)" class="tag-toggle-btn tgt-npc" data-tag="npc">
                        <span class="material-symbols-rounded text-[16px]">groups</span> NPC
                    </button>
                    <button type="button" onclick="toggleModalTag('demanda', this)" class="tag-toggle-btn tgt-demanda" data-tag="demanda">
                        <span class="material-symbols-rounded text-[16px]">description</span> Demanda
                    </button>
                    <button type="button" onclick="toggleModalTag('personagem', this)" class="tag-toggle-btn tgt-personagem" data-tag="personagem">
                        <span class="material-symbols-rounded text-[16px]">badge</span> Personagem
                    </button>
                </div>
            </div>

            <div class="pt-2 border-t border-[#141a17]">
                <button type="button" onclick="saveNote()" class="w-full bg-[#101613] hover:bg-[#141c17] border border-[#2b3630] hover:border-[#c2a675] text-[#c2a675] font-title font-bold uppercase tracking-widest py-2.5 rounded-sm transition-all shadow-md flex items-center justify-center gap-2">
                    <span class="material-symbols-rounded text-lg">save</span> Salvar Registro
                </button>
            </div>
        </div>
    </div>

    <script>
        const storedPlayer = localStorage.getItem('active_player');
        const storedCampaign = localStorage.getItem('active_campaign');

        let userRole = 'cronista';
        let currentCampaignChapter = 1;
        let currentCampaignPart = 'A:1';

        if (storedCampaign) {
            try {
                const cData = JSON.parse(storedCampaign);
                currentCampaignChapter = cData.chapter || 1;
                currentCampaignPart = cData.part || 'A:1';
            } catch(e) {}
        } else if (storedPlayer) {
            userRole = 'jogador';
        }

        let diaryEntries = [];
        let currentFilter = 'all';
        let modalSelectedTags = new Set();
        
        let modalMode = 'create'; 
        let targetNoteId = null;
        let targetReplyId = null;

        function loadDiary() {
            const contextDataRaw = userRole === 'cronista' ? storedCampaign : storedPlayer;
            if (contextDataRaw) {
                try {
                    const data = JSON.parse(contextDataRaw);
                    if (data.diary && Array.isArray(data.diary)) {
                        diaryEntries = data.diary.map(n => ({
                            ...n,
                            replies: n.replies || [],
                            updatedAt: n.updatedAt || n.date
                        }));
                    } else {
                        diaryEntries = [
                            {
                                id: 'note_demo_1',
                                text: 'Encontramos um item suspeito escondido. Ele sumiu ao toque. Melhor voltarmos aqui depois.',
                                tags: ['local', 'personagem'],
                                chapter: 1,
                                part: '115',
                                date: new Date(Date.now() - 172800000).toISOString(),
                                updatedAt: new Date(Date.now() - 86400000).toISOString(),
                                replies: [
                                    {
                                        id: 'reply_demo_1',
                                        text: 'Ao dormir hoje, sonhei com o item do local 115 pegando fogo.',
                                        chapter: 2,
                                        part: 'B:1',
                                        date: new Date(Date.now() - 86400000).toISOString()
                                    }
                                ]
                            },
                            {
                                id: 'note_demo_2',
                                text: 'A velha deste casebre é muda, mas parece esconder algo sobre o cavaleiro de ontem. O olhar dela me causou calafrios.',
                                tags: ['npc'],
                                chapter: 1,
                                part: '132',
                                date: new Date().toISOString(),
                                updatedAt: new Date().toISOString(),
                                replies: []
                            }
                        ];
                    }
                } catch(e) {}
            }
        }

        function saveDiaryToStorage() {
            const storageKey = userRole === 'cronista' ? 'active_campaign' : 'active_player';
            const contextDataRaw = localStorage.getItem(storageKey);
            if (contextDataRaw) {
                try {
                    const data = JSON.parse(contextDataRaw);
                    data.diary = diaryEntries;
                    localStorage.setItem(storageKey, JSON.stringify(data));
                } catch(e) {}
            }
        }

        function renderBottomNav() {
            const navContainer = document.getElementById('bottom-nav-bar');
            if (!navContainer) return;

            if (userRole === 'cronista') {
                navContainer.innerHTML = `
                    <a href="cronica.html" class="bottom-nav-item text-[#6d7872] hover:text-[#b8b4a7]"><span class="material-symbols-rounded text-[26px]">hourglass_bottom</span><span class="bottom-nav-label">Crônica</span></a>
                    <a href="condicoes.html" class="bottom-nav-item text-[#6d7872] hover:text-[#b8b4a7]"><span class="material-symbols-rounded text-[26px]">library_books</span><span class="bottom-nav-label">Condições</span></a>
                    <a href="diario.html" class="bottom-nav-item text-[#c2a675]"><span class="material-symbols-rounded text-[26px]">auto_stories</span><span class="bottom-nav-label">Diário</span></a>
                    <a href="grupo.html" class="bottom-nav-item text-[#6d7872] hover:text-[#b8b4a7]"><span class="material-symbols-rounded text-[26px]">groups_2</span><span class="bottom-nav-label">Grupo</span></a>
                    <a href="salvar.html" class="bottom-nav-item text-[#6d7872] hover:text-[#b8b4a7]"><span class="material-symbols-rounded text-[26px]">book_6</span><span class="bottom-nav-label">Salvar</span></a>
                `;
            } else {
                navContainer.innerHTML = `
                    <a href="cronica.html" class="bottom-nav-item text-[#6d7872] hover:text-[#b8b4a7]"><span class="material-symbols-rounded text-[26px]">hourglass_bottom</span><span class="bottom-nav-label">Crônica</span></a>
                    <a href="condicoes.html" class="bottom-nav-item text-[#6d7872] hover:text-[#b8b4a7]"><span class="material-symbols-rounded text-[26px]">library_books</span><span class="bottom-nav-label">Condições</span></a>
                    <a href="diario.html" class="bottom-nav-item text-[#c2a675]"><span class="material-symbols-rounded text-[26px]">history_edu</span><span class="bottom-nav-label">Diário</span></a>
                    <a href="grupo.html" class="bottom-nav-item text-[#6d7872] hover:text-[#b8b4a7]"><span class="material-symbols-rounded text-[26px]">sports_martial_arts</span><span class="bottom-nav-label">Personagem</span></a>
                    <a href="exportar.html" class="bottom-nav-item text-[#6d7872] hover:text-[#b8b4a7]"><span class="material-symbols-rounded text-[26px]">share</span><span class="bottom-nav-label">Exportar</span></a>
                `;
            }
        }

        function setFilter(tag) {
            currentFilter = tag;
            const filters = ['all', 'local', 'npc', 'demanda', 'personagem'];
            filters.forEach(f => {
                const el = document.getElementById(`flt-${f}`);
                if (el) {
                    if (f === tag) el.classList.add('active');
                    else el.classList.remove('active');
                }
            });
            renderDiary();
        }

        function getTagMarkup(tag) {
            switch(tag) {
                case 'local': return '<div class="fitilho fitilho-local" title="Local"><span class="material-symbols-rounded text-[#c2a675] text-[14px]">place</span></div>';
                case 'npc': return '<div class="fitilho fitilho-npc" title="NPC"><span class="material-symbols-rounded text-[#c2a675] text-[14px]">groups</span></div>';
                case 'demanda': return '<div class="fitilho fitilho-demanda" title="Demanda"><span class="material-symbols-rounded text-[#c2a675] text-[14px]">description</span></div>';
                case 'personagem': return '<div class="fitilho fitilho-personagem" title="Personagem"><span class="material-symbols-rounded text-[#c2a675] text-[14px]">badge</span></div>';
                default: return '';
            }
        }

        function renderDiary() {
            const container = document.getElementById('diary-timeline');
            const searchVal = document.getElementById('search-diary').value.toLowerCase();
            if (!container) return;

            let filtered = [...diaryEntries];

            if (currentFilter !== 'all') {
                filtered = filtered.filter(n => n.tags.includes(currentFilter));
            }
            if (searchVal.trim() !== '') {
                filtered = filtered.filter(n => 
                    n.text.toLowerCase().includes(searchVal) || 
                    n.replies.some(r => r.text.toLowerCase().includes(searchVal))
                );
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center p-6 border border-dashed border-[#1a211e] rounded bg-[#070908] mt-4 mx-2">
                        <span class="material-symbols-rounded text-4xl text-[#2b3630] mb-2">import_contacts</span>
                        <p class="font-celtic text-[#6d7872] text-[16px] italic">As páginas estão em branco...</p>
                    </div>`;
                return;
            }

            const grouped = {};
            filtered.forEach(note => {
                const ch = parseInt(note.chapter) || 1;
                if (!grouped[ch]) grouped[ch] = [];
                grouped[ch].push(note);
            });

            const chapters = Object.keys(grouped).map(Number).sort((a, b) => b - a);
            let html = '';

            chapters.forEach(ch => {
                html += `
                    <div class="chapter-divider">
                        <span class="chapter-title-box">Capítulo ${ch}</span>
                    </div>
                `;

                const notes = grouped[ch].sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));

                notes.forEach(note => {
                    const dateObj = new Date(note.date);
                    const dateStr = dateObj.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });
                    
                    let tagsHtml = '';
                    if (note.tags && note.tags.length > 0) {
                        tagsHtml = `<div class="tags-container">${note.tags.map(t => getTagMarkup(t)).join('')}</div>`;
                    }

                    let repliesHtml = '';
                    if (note.replies && note.replies.length > 0) {
                        note.replies.forEach(reply => {
                            const rDate = new Date(reply.date).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });
                            repliesHtml += `
                                <div class="reply-card">
                                    <div class="journal-actions !top-0 !right-0">
                                        <button onclick="openNoteModal('edit_reply', '${note.id}', '${reply.id}')" class="action-btn" title="Editar">
                                            <span class="material-symbols-rounded text-xs">edit</span>
                                        </button>
                                        <button onclick="requestDeleteReply(event, '${note.id}', '${reply.id}', this)" class="action-btn del" title="Apagar">
                                            <span class="material-symbols-rounded text-xs pointer-events-none">delete</span>
                                        </button>
                                    </div>
                                    <div class="mb-1.5 flex items-baseline gap-1.5 pr-12">
                                        <span class="font-title text-[12px] text-[#c2a675] font-bold tracking-widest uppercase">Capítulo ${reply.chapter}</span>
                                        <span class="font-sans text-[11px] text-[#8c938f] font-bold uppercase tracking-wider">• Parte ${reply.part}</span>
                                        <span class="text-[10px] font-celtic text-[#6d7872] italic ml-auto mr-12">${rDate}</span>
                                    </div>
                                    <p class="font-celtic text-[#b8b4a7] text-[15px] leading-snug whitespace-pre-wrap">${reply.text}</p>
                                </div>
                            `;
                        });
                    }

                    html += `
                        <div class="journal-entry">
                            ${tagsHtml}
                            
                            <div class="entry-header">
                                <span class="font-title text-[14px] text-[#8c938f] tracking-widest uppercase font-bold">Parte ${note.part}</span>
                                <div class="text-[11.5px] font-celtic text-[#6d7872] italic">${dateStr}</div>
                            </div>

                            <p class="font-celtic text-[#b8b4a7] text-[16.5px] leading-relaxed whitespace-pre-wrap">${note.text}</p>
                            
                            ${repliesHtml}

                            <button onclick="openNoteModal('reply', '${note.id}')" class="reply-action-btn">
                                <span class="material-symbols-rounded text-sm">subdirectory_arrow_right</span> Adicionar Desdobramento
                            </button>
                            
                            <div class="journal-actions">
                                <button onclick="openNoteModal('edit_note', '${note.id}')" class="action-btn" title="Editar Nota">
                                    <span class="material-symbols-rounded text-sm">edit</span>
                                </button>
                                <button onclick="requestDeleteNote(event, '${note.id}', this)" class="action-btn del" title="Apagar Página">
                                    <span class="material-symbols-rounded text-sm pointer-events-none">delete</span>
                                </button>
                            </div>
                        </div>
                    `;
                });
            });

            container.innerHTML = html;
        }

        function requestDeleteNote(event, noteId, btnEl) {
            event.stopPropagation();
            if (btnEl.classList.contains('delete-confirm')) {
                diaryEntries = diaryEntries.filter(n => n.id !== noteId);
                saveDiaryToStorage();
                renderDiary();
            } else {
                btnEl.classList.add('delete-confirm');
                setTimeout(() => {
                    if (document.body.contains(btnEl)) btnEl.classList.remove('delete-confirm');
                }, 2500);
            }
        }

        function requestDeleteReply(event, parentId, replyId, btnEl) {
            event.stopPropagation();
            if (btnEl.classList.contains('delete-confirm')) {
                const parent = diaryEntries.find(n => n.id === parentId);
                if (parent) {
                    parent.replies = parent.replies.filter(r => r.id !== replyId);
                    saveDiaryToStorage();
                    renderDiary();
                }
            } else {
                btnEl.classList.add('delete-confirm');
                setTimeout(() => {
                    if (document.body.contains(btnEl)) btnEl.classList.remove('delete-confirm');
                }, 2500);
            }
        }

        function openNoteModal(mode = 'create', noteId = null, replyId = null) {
            modalMode = mode;
            targetNoteId = noteId;
            targetReplyId = replyId;
            
            modalSelectedTags.clear();
            document.querySelectorAll('.tag-toggle-btn').forEach(btn => btn.classList.remove('active'));

            const titleEl = document.getElementById('modal-title');
            const tagsSec = document.getElementById('modal-tags-section');
            const timeCtx = document.getElementById('modal-time-context');
            const inputChap = document.getElementById('input-chapter');
            const inputPart = document.getElementById('input-part');
            const inputText = document.getElementById('note-text-input');

            inputChap.value = currentCampaignChapter;
            inputPart.value = currentCampaignPart;
            inputText.value = '';

            if (mode === 'create') {
                titleEl.innerHTML = `<span class=\"material-symbols-rounded text-[18px]\">history_edu</span> Nova Anotação`;
                tagsSec.classList.remove('hidden');
                inputText.placeholder = "O que aconteceu?...";
            
            } else if (mode === 'reply') {
                titleEl.innerHTML = `<span class=\"material-symbols-rounded text-[18px]\">subdirectory_arrow_right</span> Desdobramento`;
                tagsSec.classList.add('hidden');
                inputText.placeholder = "O que descobriu depois?...";
            
            } else if (mode === 'edit_note') {
                titleEl.innerHTML = `<span class=\"material-symbols-rounded text-[18px]\">edit</span> Editar Anotação`;
                tagsSec.classList.remove('hidden');
                
                const note = diaryEntries.find(n => n.id === noteId);
                if (note) {
                    inputChap.value = note.chapter;
                    inputPart.value = note.part;
                    inputText.value = note.text;
                    note.tags.forEach(t => {
                        modalSelectedTags.add(t);
                        const btn = document.querySelector(`.tgt-${t}`);
                        if(btn) btn.classList.add('active');
                    });
                }
            } else if (mode === 'edit_reply') {
                titleEl.innerHTML = `<span class=\"material-symbols-rounded text-[18px]\">edit</span> Editar Desdobramento`;
                tagsSec.classList.add('hidden');

                const parent = diaryEntries.find(n => n.id === noteId);
                if (parent) {
                    const reply = parent.replies.find(r => r.id === replyId);
                    if (reply) {
                        inputChap.value = reply.chapter;
                        inputPart.value = reply.part;
                        inputText.value = reply.text;
                    }
                }
            }

            document.getElementById('note-modal').classList.remove('hidden');
            setTimeout(() => inputText.focus(), 100);
        }

        function closeNoteModal() {
            document.getElementById('note-modal').classList.add('hidden');
        }

        function toggleModalTag(tag, btnEl) {
            if (modalSelectedTags.has(tag)) {
                modalSelectedTags.delete(tag);
                btnEl.classList.remove('active');
            } else {
                modalSelectedTags.add(tag);
                btnEl.classList.add('active');
            }
        }

        function saveNote() {
            const textVal = document.getElementById('note-text-input').value.trim();
            const chapVal = parseInt(document.getElementById('input-chapter').value) || 1;
            const partVal = document.getElementById('input-part').value || 'A:1';

            if (!textVal) {
                alert("O texto não pode estar vazio.");
                return;
            }

            const currentIsoDate = new Date().toISOString();

            if (modalMode === 'create') {
                diaryEntries.push({
                    id: 'note_' + Date.now(),
                    text: textVal,
                    tags: Array.from(modalSelectedTags),
                    chapter: chapVal,
                    part: partVal,
                    date: currentIsoDate,
                    updatedAt: currentIsoDate,
                    replies: []
                });
            } else if (modalMode === 'reply') {
                const parent = diaryEntries.find(n => n.id === targetNoteId);
                if (parent) {
                    parent.replies.push({
                        id: 'reply_' + Date.now(),
                        text: textVal,
                        chapter: chapVal,
                        part: partVal,
                        date: currentIsoDate
                    });
                    parent.updatedAt = currentIsoDate;
                }
            } else if (modalMode === 'edit_note') {
                const note = diaryEntries.find(n => n.id === targetNoteId);
                if (note) {
                    note.text = textVal;
                    note.chapter = chapVal;
                    note.part = partVal;
                    note.tags = Array.from(modalSelectedTags);
                }
            } else if (modalMode === 'edit_reply') {
                const parent = diaryEntries.find(n => n.id === targetNoteId);
                if (parent) {
                    const reply = parent.replies.find(r => r.id === targetReplyId);
                    if (reply) {
                        reply.text = textVal;
                        reply.chapter = chapVal;
                        reply.part = partVal;
                    }
                }
            }

            saveDiaryToStorage();
            closeNoteModal();
            renderDiary();
            
            if (modalMode === 'create' || modalMode === 'reply') {
                const scrollWrapper = document.getElementById('main-scroll');
                if (scrollWrapper) {
                    scrollWrapper.scrollTo({ top: 0, behavior: 'smooth' });
                }
            }
        }

        /* Lógica do Popover de Ecos */
        let isPlaying = false;
        let isMuffled = false;
        let preMuffleVolume = 80;

        function togglePlayerMenu() {
            const panel = document.getElementById('player-panel');
            const overlay = document.getElementById('player-overlay');
            if (panel.classList.contains('opacity-0')) {
                overlay.style.display = 'block';
                panel.classList.remove('opacity-0', 'scale-95', 'pointer-events-none');
                panel.classList.add('opacity-100', 'scale-100', 'pointer-events-auto');
            } else {
                overlay.style.display = 'none';
                panel.classList.remove('opacity-100', 'scale-100', 'pointer-events-auto');
                panel.classList.add('opacity-0', 'scale-95', 'pointer-events-none');
            }
        }

        function togglePlayState() {
            isPlaying = !isPlaying;
            const icon = document.getElementById('play-icon');
            icon.innerText = isPlaying ? "pause" : "play_arrow";
        }

        function toggleMuffle() {
            const muffleBtn = document.getElementById('muffle-btn');
            const volSlider = document.getElementById('vol-slider');
            isMuffled = !isMuffled;
            if(isMuffled) {
                preMuffleVolume = volSlider.value;
                volSlider.value = 15; 
                muffleBtn.classList.add('active');
            } else {
                volSlider.value = preMuffleVolume; 
                muffleBtn.classList.remove('active');
            }
        }

        function updateVolume(val) {
            if(isMuffled) {
                isMuffled = false;
                document.getElementById('muffle-btn').classList.remove('active');
            }
        }

        window.onload = () => {
            loadDiary();
            renderBottomNav();
            renderDiary();
        };
    </script>
</body>
</html>
